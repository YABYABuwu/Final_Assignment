# ทุกระยะเป็นเมตร, มุมเป็นองศา, ความเร็วเลื่อนเป็น m/s, ความเร็วหมุนเป็น deg/s
connection:
  type: ap                 # ap = ต่อ Wi-Fi ของหุ่นยนต์; sta = ผ่านเราเตอร์; rndis = USB

motion:
  position_tolerance_m: 0.015  # ถือว่าถึงจุดเมื่อห่างไม่เกิน 5 ซม.
  angle_tolerance_deg: 1      # ยอมให้มุมคลาดเคลื่อนได้ 3 องศา
  timeout_s: 15               # เวลาสูงสุดต่อ waypoint
  sample_timeout_s: 1.0       # หาก position/attitude เก่ากว่านี้ ให้หยุด
  control_period_s: 0.1       # ระยะเวลาระหว่างคำสั่งความเร็ว
  max_speed_m_s: 0.4         # เพดานความเร็วรวมของแกน x/y
  max_lateral_accel_m_s2: 0.30 # จำกัดการเร่งเฉพาะสไลด์ซ้าย/ขวา; เดินหน้า/ถอยหลังใช้ PID ตามเดิม
  max_turn_deg_s: 45          # เพดานความเร็วหมุน
  hold_heading: true          # yaw: null = รักษามุมเดิมข้าม waypoint ไม่ให้ drift สะสม
  pid:
    x: {kp: 1, ki: 0.4, kd: 0.05}    # ควบคุมตำแหน่งแกน x
    y: {kp: 1, ki: 0.4, kd: 0.05}    # ควบคุมตำแหน่งแกน y
    yaw: {kp: 1.2, ki: 0.1, kd: 0.01}  # ควบคุมมุมตัวรถ

logging:
  directory: data/raw      # โฟลเดอร์ CSV; อ้างอิงจาก TemplateProject
  preview_duration_s: 3    # เมื่อ mission ปิด ให้เก็บข้อมูลนานกี่วินาทีก่อนออก
  queue_max_rows: 1000      # จำนวนแถวสูงสุดที่รอเขียนใน RAM; เต็มแล้วข้ามแถวใหม่
  history_max_samples: 2000 # จำนวนจุดย้อนหลังต่อ stream ที่ใช้ในกราฟ/แผนที่
  batch_size: 50            # เขียน CSV ครั้งละไม่เกินกี่แถว
  flush_interval_s: 0.25   # รอรวมแถวได้นานสูงสุดเท่าไร ก่อนเขียน
  # enabled = รับข้อมูลมาใช้, save = เขียน CSV; frequency_hz ต้องเป็น 1/5/10/20/50
  # position กับ attitude จำเป็นสำหรับ move_to แม้ตั้ง save: false
  streams:
    position: {enabled: true, save: true, frequency_hz: 20}
    attitude: {enabled: true, save: true, frequency_hz: 10}
    imu:      {enabled: false, save: false, frequency_hz: 10}
    esc:      {enabled: false, save: false, frequency_hz: 10}
    status:   {enabled: true, save: true, frequency_hz: 5}
    tof:      {enabled: true, save: true, frequency_hz: 20}
    adapter:  {enabled: true, save: true, frequency_hz: 20} # IR กันชนหน้า/หลัง; IO/ADC จาก sensor adaptor
    battery:  {enabled: true, save: true, frequency_hz: 5}
    gimbal:   {enabled: true, save: true, frequency_hz: 10}

dashboard:
  enabled: true           # true = เปิดหน้าเว็บและกล้องพร้อมกับโปรแกรม
  host: 127.0.0.1          # เปิดดูจากคอมที่รันโปรแกรมเท่านั้น
  port: 8000               # URL: http://127.0.0.1:8000
  resolution: 360p         # 360p / 540p / 720p; เริ่มต่ำเพื่อประหยัด Wi-Fi
  max_fps: 20               # จำนวนภาพ JPEG สูงสุดที่ส่งให้หน้าเว็บต่อวินาที
  jpeg_quality: 70         # 1-100; ค่าสูงใช้แบนด์วิดท์และ CPU มากขึ้น

review:
  host: 127.0.0.1          # หน้าอ่านข้อมูลย้อนหลัง เปิดเฉพาะคอมเครื่องนี้
  port: 8001               # URL: http://127.0.0.1:8001
  max_points_per_stream: 10000 # จำกัดจุดที่ส่งให้เบราว์เซอร์ต่อ CSV; ไฟล์จริงยังครบ
  close_tof_mm: 200        # แจ้งเหตุการณ์เมื่อ ToF ช่อง 0 ต่ำกว่าระยะนี้ (mm)

rear_ir:
  enabled: true
  right: {id: 3, port: 2, active_io: 0} # หลังขวา: io_1; พบวัตถุเป็น IO=0 ตามข้อมูลล่าสุด
  left: {id: 4, port: 1, active_io: 0}  # ซ้าย: polarity กลับด้านจากขวาตามการทดสอบล่าสุด
  max_age_s: 0.5          # ข้อมูลเก่ากว่านี้หยุดการถอย/สไลด์/หมุนจนได้ค่าใหม่
  recovery_speed_m_s: 0.08 # ครั้ง 1 หลบข้าง, ครั้ง 2 หน้า, ครั้ง 3 ทแยง; ทั้งคู่ไปหน้า
  recovery_max_m: 0.12    # ระยะหลบสูงสุดต่อหนึ่งครั้ง
  recovery_max_attempts: 3 # ตรวจซ้ำแล้วยังติด ให้ลองหลบได้สูงสุด 3 ครั้งต่อ move_to
  recovery_clear_samples: 3 # ต้องเห็น IO ว่างจาก callback ใหม่ต่อเนื่องก่อนเดินต่อ

# รอสอบเทียบค่า IO ตอนบังเซนเซอร์หน้าทั้งสองข้างก่อนเปิดระบบกันชนหน้า
front_ir:
  enabled: true
  right: {id: 1, port: 1, active_io: 0} # หน้าขวา: io_6; กำหนด 0/1 หลังสอบเทียบ
  left: {id: 4, port: 2, active_io: 0}  # หน้าซ้าย: io_8; กำหนด 0/1 หลังสอบเทียบ
  max_age_s: 0.5
  recovery_speed_m_s: 0.08
  recovery_max_m: 0.12
  recovery_max_attempts: 3
  recovery_clear_samples: 3

mission:
  enabled: false          # เริ่มจาก false เพื่อไม่ให้รถวิ่งทันทีเมื่อทดสอบการเชื่อมต่อ
  waypoints:              # พิกัดสัมบูรณ์จากตำแหน่งเริ่มต้น; yaw: null = รักษาทิศเดิม
    - {x: 0.6, y: 0.0, yaw: null}
    - {x: 1.2, y: 0.0, yaw: null}
    - {x: 1.8, y: 0.0, yaw: null}
    - {x: 1.8, y: 0.6, yaw: null}
    - {x: 1.2, y: 0.6, yaw: null}
    - {x: 0.6, y: 0.6, yaw: null}


exploration:
  enabled: true       # เปิดหลังสอบเทียบตำแหน่งแกน yaw/pivot และระยะหัว ToF; true = เริ่ม SLAM + DFS และสั่งรถเดิน
  position_coordinate_system: 1 # ผูกแผนที่กับพิกัดตั้งแต่เปิดหุ่นยนต์ เพื่อให้โหลดแผนที่เดิมได้ในรอบเปิดเครื่องเดียวกัน
  step_m: 0.60            # ขนาดช่องกริดกำแพง และระยะเดินระหว่างศูนย์กลางช่อง
  max_speed_m_s: 0.20     # จำกัดความเร็วขณะสำรวจแยกจาก mission waypoint
  heading_source: attitude # ใช้ yaw chassis สำหรับ PID และทิศสแกน; gimbal ground-relative มีความคลาดสะสมใน log 20260927
  wall_threshold_mm: 500 # ToF <= ค่านี้เป็นกำแพง; มากกว่านี้เป็นทางเปิด
  tof_median_window: 3   # ใช้ scan ใหม่ 3 ครั้งหลัง gimbal หยุด แล้วเลือกค่ากลางก่อนตัดสินใจ DFS
  emergency_stop_distance_m: 0.20 # ระยะกึ่งกลาง chassis ถึงกำแพงที่หยุดระหว่างเดินตามกริด
  alignment:
    enabled: true         # จัดตำแหน่งจากกำแพงที่เลือกหลังสแกนครบ 4 ทิศ
    wall_distance_m: 0.20 # เป้าหมายเมื่อมีผนังฝั่งเดียว; สองฝั่งให้ระยะเท่ากัน
    tolerance_m: 0.03     # ไม่ขยับถ้าคลาดไม่เกิน 3 ซม.
    max_shift_m: 0.10     # ระยะขยับสูงสุดต่อช่วง; วัดผนังใหม่ก่อนขยับช่วงถัดไป
  max_nodes: 120           # จำกัดจำนวนช่องที่ DFS จะเข้าเยี่ยมต่อรอบ
  update_hz: 5
  max_sample_age_s: 1.0 # อายุสูงสุดของข้อมูลที่ใช้ตัดสินใจ; ไม่ใช่เวลารองาน
  sample_skew_s: 0.25
  sensor:
    tof_channel: 0         # ดัชนีใน sub_distance เริ่มนับจาก 0 (ช่องที่ใช้จริง)
    offset_from_yaw_axis_m: 0.075 # ระยะจากแกนหมุน yaw ถึงหัว ToF ตามข้อมูลการติดตั้ง
    offset_yaw_deg: 0.0    # ทิศของ offset เทียบแนวเลนส์; 0 = อยู่ตามแนวเลนส์
    pivot_x_m: 0.0         # ตำแหน่งแกน yaw เทียบจุดกึ่งกลางหุ่น; ปรับเมื่อวัดได้
    pivot_y_m: 0.0
    yaw_offset_deg: 0.0    # มุมคลาดระหว่างแนวเลนส์กับแนวหน้า gimbal
  gimbal:
    auto_recenter: true     # ตั้งศูนย์กายภาพอัตโนมัติหนึ่งครั้งก่อนเริ่ม DFS
    recenter_speed_deg_s: 60
    pitch_deg: 0.0          # มุมหัวเทียบตัวรถ; ไม่ชดเชย pitch ของ chassis
    yaw_speed_deg_s: 120
    angle_tolerance_deg: 3 # tolerance ของ yaw
    pitch_tolerance_deg: 8 # telemetry เปลี่ยนตาม yaw สูงสุดราว 7.1°; yaw ยังใช้ tolerance 3°
  target_inspection:
    enabled: true           # ตรวจทุกขอบที่เป็นกำแพงหนึ่งครั้งขณะ DFS หยุดนิ่ง
    pitch_deg: -20.0        # มุมก้มที่คำสั่งกิมบอลแสดงใน pitch_ground; ตรวจทิศจริงก่อนยิง
    selected: all           # all หรือรายการ เช่น [red:circle, blue:vertical]
    min_area_fraction: 0.02 # ขั้นต่ำ 2% ของภาพ; 360p ประมาณ 4608 px² มากกว่าเกณฑ์เดิม
    confirm_frames: 3       # ต้องเห็นสี/รูปร่างเดิมต่อเนื่องก่อนเล็ง
    lock_frames: 3          # ยืนยันว่าเป้ายังอยู่ในภาพต่อเนื่องที่มุมเล็งที่ดีที่สุดก่อนยิง 2 นัด
    center_radius_fraction: 0.04
    aim_offset_x_fraction: 0.0 # ปรับจุดเล็ง IR เทียบกึ่งกลางภาพหลังทดลองระยะใกล้
    aim_offset_y_fraction: 0.0
    max_aim_steps: 12       # จำนวนคำสั่งกิมบอลสูงสุดต่อเป้า ไม่ใช่ timeout
    max_targets_per_wall: 16 # จำนวนเป้าสูงสุดที่ตรวจต่อกำแพงหนึ่งด้าน
    max_step_deg: 6.0       # จำกัดการปรับหัวแต่ละครั้ง
    camera_hfov_deg: 90.0   # ค่าเริ่มทดลอง ต้องสอบเทียบภาพจริง
    camera_vfov_deg: 60.0
    fire_mode: infrared
  map:
    resolution_m: 0.05
    width_m: 8.0
    height_m: 8.0
    robot_clearance_m: 0.20 # ระยะจากหัว ToF ที่ไม่ทำแผนที่ใต้ตัวหุ่น; ไม่ใช่เกณฑ์รับ/ปฏิเสธค่า
    free_update: -0.40
    occupied_update: 0.85
    save_path: data/maps/latest.json # จบรันบันทึก JSON, occupancy PNG และ grid PNG
    load_path: null       # ใส่ path ของไฟล์ JSON ที่เคยส่งออก เมื่อต้องการอ่านกลับ
  scan_match:
    translation_m: 0.10
    angle_deg: 4.0
    angle_step_deg: 2.0
    minimum_score: 0.15
    minimum_improvement: 0.08
